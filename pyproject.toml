[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "production-agent-systems"
version = "1.0.0"
description = "Provider-neutral effect assurance and reliability testing for agent tool operations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Peyman Salimi" }]
dependencies = []

[project.scripts]
agent-effect = "production_agent_systems.testkit:main"
agent-effect-ops = "production_agent_systems.effect_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.13",
  "mypy>=1.18",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
